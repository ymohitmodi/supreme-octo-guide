name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (pulls NYX from git)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check darkfactory tests

      - name: Test (pytest)
        # The whole factory — idea mining, the novelty bar-raiser, real
        # experiments, and LaTeX generation — runs offline in deterministic MOCK
        # mode (no OLLAMA_API_KEY), so CI exercises the full pipeline.
        run: pytest -q

      - name: Smoke-test the pipeline end to end
        run: |
          python -m darkfactory doctor
          python -m darkfactory serve --max 3 --outdir output/papers
          test -f output/papers/INDEX.md
